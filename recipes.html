<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes · Coffee Pantry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Coffee Pantry</a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="site-nav">
      <a href="index.html">Beans</a>
      <a href="recipes.html">Recipes</a>
      <a href="equipment.html">Equipment</a>
      <a href="cafes.html">Cafes</a>
      <a href="social.html">Social</a>
      <a href="references.html">References</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h1>Recipes</h1>
    <p class="page-intro">Brewing recipes tried at home.</p>

    <div class="toolbar">
      <div class="toolbar-group">
        <span class="toolbar-label">Recipes:</span>
        <div id="recipe-buttons" class="recipe-buttons"></div>
      </div>
    </div>

    <div class="card-grid recipe-grid" id="recipes-list"></div>
  </main>

  <footer class="site-footer">Coffee Pantry (a personal project, not hosted, yet).</footer>
  <script src="js/main.js"></script>
  <script>
    function renderSteps(steps, startIndex = 0) {
      if (!steps || !steps.length) return "";
      const items = steps
        .map((s, i) => {
          const label = s.label.charAt(0).toUpperCase() + s.label.slice(1);
          return `<div class="step"><strong>${startIndex + i + 1}. ${label}:</strong> ${s.detail}</div>`;
        })
        .join("");
      return `<div class="step-list">${items}</div>`;
    }

    function renderPourSchedule(schedule) {
      if (!schedule || !schedule.length) return "";
      const rows = schedule.map((row) => `<tr><td>${row.time}</td><td>${row.action}</td></tr>`).join("");
      return `<p class="sub-heading">Pouring</p><table class="pour-table"><tbody>${rows}</tbody></table>`;
    }

    function renderRatioTable(ratios) {
      if (!ratios || !ratios.length) return "";
      const rows = ratios
        .map((r) => `<tr><td>${r.style}</td><td>${r.ratio}</td><td>${r.example}</td></tr>`)
        .join("");
      return `<p class="sub-heading">Espresso ratios (dry:wet dose)</p><table class="pour-table"><thead><tr><th>Style</th><th>Ratio</th><th>Example (17g dose in)</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderDrinkGuide(drinks) {
      if (!drinks || !drinks.length) return "";
      const cards = drinks
        .map((d) => `
          <div class="drink-card">
            ${d.image ? `<img src="${d.image}" alt="${d.drink}"${d.compact ? ' class="drink-img-small"' : ""}>` : ""}
            <div class="drink-info">
              <h4>${d.drink}</h4>
              <ul class="spec-list">
                <li><strong>Ratio:</strong> ${d.ratio}</li>
                <li><strong>Milk (40ml espresso):</strong> ${d.milkAt40ml}</li>
                <li><strong>Foam:</strong> ${d.foam}</li>
              </ul>
            </div>
          </div>
        `)
        .join("");
      return `<div class="drink-grid">${cards}</div>`;
    }

    function renderSubList(title, items) {
      if (!items || !items.length) return "";
      const rows = items.map((i) => `<li>${i}</li>`).join("");
      return `<p class="sub-heading">${title}</p><ul class="tip-list">${rows}</ul>`;
    }

    function recipeTemplate(item) {
      const hasDrinkGuide = item.drinkGuide && item.drinkGuide.length && item.steps && item.steps.length;
      const stepsHtml = hasDrinkGuide
        ? renderSteps(item.steps.slice(0, 1)) + renderDrinkGuide(item.drinkGuide) + renderSteps(item.steps.slice(1), 1)
        : renderSteps(item.steps) + renderDrinkGuide(item.drinkGuide);

      return `
        <article class="card recipe-card">
          <div class="recipe-title-row">
            ${item.icon ? `<img class="recipe-icon" src="${item.icon}" alt="">` : ""}
            <h3>${item.name}</h3>
          </div>
          ${item.ratio ? `<p class="card-meta">Ratio: ${item.ratio}</p>` : ""}
          ${stepsHtml}
          ${renderPourSchedule(item.pourSchedule)}
          ${renderRatioTable(item.ratios)}
          ${renderSubList("Tips", item.tips)}
          ${renderSubList("Troubleshooting", item.troubleshooting)}
          ${item.cleanup ? `<p class="card-meta">Cleanup: ${item.cleanup}</p>` : ""}
        </article>
      `;
    }

    let recipesData = [];
    let currentRecipe = "Drip";

    function applyAndRender() {
      const list = currentRecipe ? recipesData.filter((r) => r.name === currentRecipe) : recipesData;
      const container = document.getElementById("recipes-list");
      container.innerHTML = list.length
        ? list.map(recipeTemplate).join("")
        : '<p class="empty-state">No recipes match this selection.</p>';
    }

    function renderButtons() {
      const wrap = document.getElementById("recipe-buttons");
      const recipeBtns = recipesData
        .map((r) => `<button class="toolbar-btn${currentRecipe === r.name ? " active" : ""}" data-recipe="${r.name}" type="button">${r.name}</button>`)
        .join("");
      wrap.innerHTML = recipeBtns;
      wrap.querySelectorAll(".toolbar-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentRecipe = btn.dataset.recipe;
          renderButtons();
          applyAndRender();
        });
      });
    }

    fetch("data/recipes.json")
      .then((res) => res.json())
      .then((data) => {
        recipesData = data;
        renderButtons();
        applyAndRender();
      })
      .catch((err) => {
        console.error("Failed to load data/recipes.json", err);
        document.getElementById("recipes-list").innerHTML =
          '<p class="empty-state">Could not load data. If you\'re viewing this via file://, try running a local server (e.g. <code>python3 -m http.server</code>) instead.</p>';
      });
  </script>
</body>
</html>
