    <a class="brand" href="index.html">Coffee Pantry</a>

  <main>
    <h1 data-pt="Equipamento">Equipment</h1>
    <p class="page-intro" data-pt="O equipamento usado em casa.">The gear in the home setup.</p>
    <div class="card-grid" id="equipment-list"></div>
  </main>

  <footer class="site-footer" data-pt="Coffee Pantry (um projeto pessoal)">Coffee Pantry (a personal project)</footer>
  <script src="js/main.js"></script>
  <script>
    function renderSpecs(specs) {
      if (!specs) return "";
      const rows = Object.entries(specs)
        .map(([key, value]) => `<li><strong>${key}:</strong> ${value}</li>`)
        .join("");
      return `<ul class="spec-list">${rows}</ul>`;
    }

    loadAndRender("data/equipment.json", "equipment-list", (item) => `
      <article class="card">
        ${item.image ? `<img src="${item.image}" alt="${item.name}">` : ""}
        <h3>${item.name}</h3>
        <p class="card-meta">${[item.brand, tf(item, "type")].filter(Boolean).join(" · ")}</p>
        ${item.price ? `<p class="card-meta">${t("Price")}: ${item.price}</p>` : ""}
        ${item.purchasedAt ? `<p class="card-meta">${t("Purchased at")}: ${item.purchasedAt}</p>` : ""}
        ${item.dateAcquired ? `<p class="card-meta">${t("Acquired")}: ${item.dateAcquired}</p>` : ""}
        ${renderSpecs(item.specs)}
        ${item.notes ? `<p>${tf(item, "notes")}</p>` : ""}
      </article>
    `);
  </script>
</body>
</html>
